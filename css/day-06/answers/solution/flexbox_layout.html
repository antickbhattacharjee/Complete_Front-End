<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="profile-card">
        <header class="profile-card__header">
            <img class="profile-card__avatar" src="https://via.placeholder.com/100" alt="User avatar">
            <h1 class="profile-card__name">Jane Doe</h1>
            <p class="profile-card__title">Senior Front-End Developer</p>
        </header>
        
        <section class="profile-card__stats">
            <div class="stat">
                <span class="stat__value">150</span>
                <span class="stat__label">Posts</span>
            </div>
            <div class="stat">
                <span class="stat__value">10k</span>
                <span class="stat__label">Followers</span>
            </div>
            <div class="stat">
                <span class="stat__value">500</span>
                <span class="stat__label">Following</span>
            </div>
        </section>
        
        <footer class="profile-card__actions">
            <button class="btn btn--primary">Follow</button>
            <button class="btn btn--secondary">Message</button>
        </footer>
    </main>
</body>
</html>
