<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport meta tag is essential for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Descriptive title for SEO -->
    <title>The Beatles | Fan Page</title>
</head>
<body>
    <!-- <header> is a semantic tag used for introductory content -->
    <header>
        <h1>The Beatles</h1>
        <p><em>The most influential band of all time</em></p>
    </header>

    <!-- <main> specifies the dominant content of the document -->
    <main>
        <!-- <section> groups related content logically -->
        <section aria-labelledby="about-heading">
            <h2 id="about-heading" hidden>About the Band</h2>
            
            <!-- 
                Images MUST have an 'alt' attribute for accessibility (screen readers).
                Wrapping the image in an <a> tag turns the entire image into a clickable link.
            -->
            <a href="https://en.wikipedia.org/wiki/The_Beatles" target="_blank" title="Read more about The Beatles on Wikipedia">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/The_Fabs.JPG/320px-The_Fabs.JPG" alt="The Beatles band members performing live">
            </a>
            
            <p>The Beatles were an English rock band formed in Liverpool in 1960. They are widely regarded as the most influential band of all time.</p>
            
            <!-- target="_blank" opens the link in a new browser tab/window -->
            <p>
                <a href="https://en.wikipedia.org/wiki/The_Beatles" target="_blank" rel="noopener noreferrer">Read more on Wikipedia</a>
            </p>
        </section>
    </main>

    <!-- <footer> represents the footer for its nearest sectioning content or the document itself -->
    <footer>
        <p>&copy; 2026 Beatles Fan Club</p>
    </footer>
</body>
</html>
