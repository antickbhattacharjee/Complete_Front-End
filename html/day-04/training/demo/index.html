<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links & Images Demo</title>
</head>
<body>
    <main>
        <h2>Absolute vs Relative Links</h2>
        <ul>
            <!-- Absolute link goes to an external website -->
            <li><a href="https://google.com" target="_blank" rel="noopener noreferrer">Google (Absolute)</a></li>
            <!-- Relative link goes to another file in the same project -->
            <li><a href="about.html">About Us (Relative)</a></li>
        </ul>
        
        <h2>Accessible Images</h2>
        <!-- The alt text is read aloud to visually impaired users -->
        <img src="assets/image-placeholder.svg" alt="A generic landscape placeholder showing mountains and sun" width="200" height="200">
    </main>
</body>
</html>
