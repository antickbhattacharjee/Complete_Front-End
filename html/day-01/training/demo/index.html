<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Fundamentals Demo</title>
</head>
<body>
    <header>
        <!-- Instructor Note: Elements consist of a start tag, content, and an end tag. -->
        <h1>Welcome to HTML</h1>
    </header>
    <main>
        <section>
            <!-- Instructor Note: Attributes provide additional information about elements. -->
            <p title="This is a tooltip attribute">Hover over this paragraph to see the title attribute in action.</p>
        </section>
    </main>
</body>
</html>
