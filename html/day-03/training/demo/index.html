<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Demo</title>
</head>
<body>
    <header>
        <h1>Text Formatting Examples</h1>
    </header>
    <main>
        <section>
            <!-- Instructor Note: Use <strong> for semantic importance, <b> for visual bolding. -->
            <p>This text is <strong>highly important</strong>, while this is just <b>visually bold</b>.</p>
            
            <!-- Instructor Note: Use <em> for semantic emphasis (read differently by screen readers), <i> for visual italics. -->
            <p>I <em>really</em> love coding! The word <i>pizza</i> is italicized.</p>
            
            <p>Water is H<sub>2</sub>O and E=MC<sup>2</sup>.</p>
        </section>
    </main>
</body>
</html>
