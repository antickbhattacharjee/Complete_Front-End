<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Elements Demo</title>
</head>
<body>
    <header>
        <h1>Advanced HTML5 Elements</h1>
    </header>
    <main>
        <section>
            <h2>Iframe (Embedding external content)</h2>
            <!-- Instructor Note: Iframes embed another HTML document. Always include a title attribute. -->
            <iframe src="https://example.com" width="400" height="300" title="Example Website Embed"></iframe>
        </section>
        
        <section>
            <h2>Native Dialog / Modal</h2>
            <!-- Instructor Note: The <dialog> tag provides native modal functionality without heavy JS -->
            <dialog id="myDialog" open>
                <p>This is a native HTML5 dialog box!</p>
                <form method="dialog">
                    <button>Close</button>
                </form>
            </dialog>
        </section>
    </main>
</body>
</html>
