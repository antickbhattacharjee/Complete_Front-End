<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
      Instructor Note: The <head> contains meta-information, title, and links to CSS/JS.
      It is not visible on the actual web page. 
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A demo of proper document structure">
    <title>Document Structure Demo</title>
</head>
<body>
    <!-- 
      Instructor Note: The <body> contains all the visible content of the page.
    -->
    <header>
        <h1>Proper HTML5 Structure</h1>
    </header>
    <main>
        <p>This document perfectly demonstrates the required boilerplate for any HTML file.</p>
    </main>
</body>
</html>
