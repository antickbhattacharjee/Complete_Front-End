<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Demo</title>
</head>
<body>
    <!-- Instructor Note: <header> is for site/page introduction or navigation -->
    <header>
        <h1>My Tech Blog</h1>
        <nav>
            <a href="#">Home</a> | <a href="#">Articles</a>
        </nav>
    </header>
    
    <!-- Instructor Note: <main> encapsulates the unique content of this page -->
    <main>
        <!-- Instructor Note: <article> is a self-contained, independent piece of content -->
        <article>
            <h2>Why Semantic HTML Matters</h2>
            <p>It provides meaning to the web browser and screen readers, improving accessibility and SEO.</p>
        </article>
    </main>
    
    <!-- Instructor Note: <footer> contains copyright, links, or author info -->
    <footer>
        <p>&copy; 2026 Tech Blog</p>
    </footer>
</body>
</html>
